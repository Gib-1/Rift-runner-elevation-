name: Verify game in Chromium
on:
  pull_request:
    paths:
      - index.html
      - tests/**
      - .github/workflows/verify-game.yml
permissions:
  contents: read
jobs:
  playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: node tests/simulation.mjs
      - run: python -m pip install playwright==1.55.0
      - run: google-chrome --version
      - run: python tests/browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameplay-screenshots
          path: screenshots/
